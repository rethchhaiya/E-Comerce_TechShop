spring.application.name=E-commerce

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:mydb}}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.username=${ADMIN_USERNAME:Administrator}
